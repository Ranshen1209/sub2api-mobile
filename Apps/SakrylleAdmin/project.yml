name: SakrylleAdmin
options:
  bundleIdPrefix: com.sakrylle
  deploymentTarget:
    iOS: "17.0"
packages:
  SakrylleSwift:
    path: ../..
targets:
  SakrylleAdmin:
    type: application
    platform: iOS
    sources:
      - SakrylleAdmin
    dependencies:
      - package: SakrylleSwift
        product: SakrylleShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakrylle.admin
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_CFBundleDisplayName: Sakrylle Admin
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SakrylleAdminTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SakrylleAdminTests
    dependencies:
      - target: SakrylleAdmin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakrylle.admin.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  SakrylleAdminUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SakrylleAdminUITests
    dependencies:
      - target: SakrylleAdmin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakrylle.admin.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  SakrylleAdmin:
    shared: true
    build:
      targets:
        SakrylleAdmin: all
    test:
      targets:
        - SakrylleAdminTests
        - SakrylleAdminUITests
      gatherCoverageData: false
